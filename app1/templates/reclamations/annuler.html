<form method="post">
    {% csrf_token %}
    
    <div class="mb-3">
        {{ form.motif.label_tag }}
        {{ form.motif }}
        {% if form.motif.errors %}
            <div class="text-danger">{{ form.motif.errors }}</div>
        {% endif %}
        <small class="text-muted">{{ form.motif.help_text }}</small>
    </div>
    
    <div class="mb-3">
        {{ form.agent.label_tag }}
        {{ form.agent }}
        {% if form.agent.errors %}
            <div class="text-danger">{{ form.agent.errors }}</div>
        {% endif %}
    </div>
    
    <button type="submit" class="btn btn-danger">Confirmer l'annulation</button>
    <a href="{% url 'detail_reclamation' reclamation.id %}" class="btn btn-secondary">Retour</a>
</form>
